name: Smart SMS Core CI

on:
  pull_request:
    paths:
      - 'smart-sms-core/**'
      - 'assets/card_rules/**'
      - 'src/com/android/messaging/otp/**'
      - 'src/com/android/messaging/category/**'
      - 'src/com/android/messaging/card/**'
      - 'Android.bp'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/assemble-debug.yml'

  push:
    branches:
      - lineage-23.2
      - 'arena/**'
    paths:
      - 'smart-sms-core/**'
      - 'assets/card_rules/**'
      - 'src/com/android/messaging/otp/**'
      - 'src/com/android/messaging/category/**'
      - 'src/com/android/messaging/card/**'
      - 'Android.bp'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/assemble-debug.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  smart-sms-core:
    name: Core test and assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build platform
        shell: bash
        run: |
          set -euo pipefail

          # Avoid `yes | sdkmanager --licenses`: with pipefail, yes receives
          # SIGPIPE after sdkmanager accepts licenses and can falsely fail CI.
          printf 'y\n%.0s' {1..100} > "${RUNNER_TEMP}/sdkmanager-licenses.txt"
          sdkmanager --licenses < "${RUNNER_TEMP}/sdkmanager-licenses.txt"

          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests and assemble debug AAR
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            :smart-sms-core:testDebugUnitTest \
            :smart-sms-core:assembleDebug

      - name: Upload debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: smart-sms-core-debug-aar
          path: smart-sms-core/build/outputs/aar/*-debug.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smart-sms-core-test-reports
          path: |
            smart-sms-core/build/reports/**
            smart-sms-core/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
