plugins {
    id 'com.android.application'
}

// This project intentionally consumes the canonical AOSP source tree in ../src, ../res, and
// ../assets. Do not move those files: Android.bp remains the ROM build authority.
def aospDepsDir = providers.gradleProperty("aospDepsDir").orNull
def requiredAospJars = [
        "libchips.jar",       // com.android.ex.chips RecipientEntry
        "vcard.jar",          // com.android.vcard
        "libphotoviewer.jar", // com.android.ex.photo
        "framework-stubs.jar" // optional platform/internal API stubs for local compilation
]
def aospJarFiles = aospDepsDir == null ? [] : requiredAospJars.collect { file("${aospDepsDir}/${it}") }

android {
    namespace "com.android.messaging"
    compileSdk 35

    defaultConfig {
        applicationId "com.android.messaging"
        minSdk 33
        targetSdk 34
        versionCode 10001040
        versionName "1.0.001"
    }

    sourceSets {
        main {
            manifest.srcFile "../AndroidManifest.xml"
            java.srcDirs = ["../src"]
            res.srcDirs = ["../res"]
            assets.srcDirs = ["../assets"]
            jniLibs.srcDirs = ["../prebuilts/jni"]
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':smart-sms-core')
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.collection:collection:1.4.5"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.exifinterface:exifinterface:1.3.7"
    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.loader:loader:1.1.0"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.palette:palette:1.0.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.guava:guava:33.3.1-android"

    // These are AOSP-only static libraries, not Maven artifacts. See README_GRADLE.md.
    compileOnly files(aospJarFiles)
}

tasks.register("verifyAospDependencies") {
    group = "verification"
    description = "Checks that AOSP-only compile jars are configured for a full local build."
    doLast {
        if (aospDepsDir == null) {
            throw new GradleException("Set aospDepsDir in ~/.gradle/gradle.properties; see README_GRADLE.md")
        }
        def missing = aospJarFiles.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing AOSP dependency jars: ${missing.join(', ')}")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("verifyAospDependencies"))
}
